[pytest]
testpaths = tests

norecursedirs =
    tests/test_services
    .git
    .venv
    venv
    node_modules
    staticfiles
    media
    dist
    build

python_files =
    test_*.py
    *_test.py

python_classes = Test*
python_functions = test_*

addopts =
    -v
    --reuse-db
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --ds=tests.settings
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --maxfail=5
    -n auto

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests
    external: marks tests requiring external services

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*CheckConstraint.check is deprecated.*:django.utils.deprecation.RemovedInDjango60Warning

timeout = 30

asyncio_mode = strict