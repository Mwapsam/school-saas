[pytest]
testpaths = tests

python_files = test_*_unit.py *_unit_test.py

python_functions = test_*
python_classes = Test*

addopts = 
    -v 
    --tb=short 
    --maxfail=5 
    --strict-markers
    --strict-config
    --disable-warnings
    --override-ini="DJANGO_SETTINGS_MODULE=config.settings"
    --nomigrations
    --reuse-db

markers =
    unit: marks unit tests that don't require database
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    django_db: marks tests as requiring database access

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*CheckConstraint.check is deprecated.*:django.utils.deprecation.RemovedInDjango60Warning