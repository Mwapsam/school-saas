<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription inactive - {{ tenant.name|default:"School Management" }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 6px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 32px 28px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #222;
        }

        p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-logout {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            color: #777;
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>This school's subscription is not active</h1>
        <p>
            Access to the {{ tenant.name|default:"school" }} dashboard is currently paused.
            This usually means a trial has ended or a payment is outstanding.
            Please contact your account manager to renew access.
        </p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-logout">Log out of this session</button>
        </form>
    </div>
</body>
</html>
