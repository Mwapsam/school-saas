<div class="modal fade" id="payrollLookupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="payroll-lookup-form" onsubmit="submitPayrollLookupForm(event)">
                {% csrf_token %}
                <input type="hidden" id="payroll-lookup-key" value="">
                <input type="hidden" id="payroll-lookup-id" value="">
                <div class="modal-header">
                    <h5 class="modal-title" id="payroll-lookup-modal-title">Add</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="payroll-lookup-form-errors" class="alert alert-danger d-none"></div>

                    <div class="mb-3">
                        <label for="payroll-lookup-name" class="form-label">Name *</label>
                        <input type="text" class="form-control" id="payroll-lookup-name" name="name" required>
                    </div>

                    <div class="payroll-field-group" data-for="payroll_group">
                        <div class="mb-3">
                            <label for="payroll-lookup-description" class="form-label">Description</label>
                            <textarea class="form-control" id="payroll-lookup-description" name="description" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="payroll-field-group" data-for="payroll_category">
                        <div class="mb-3">
                            <label for="payroll-lookup-code" class="form-label">Code</label>
                            <input type="text" class="form-control" id="payroll-lookup-code" name="code">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="payroll-lookup-category-type" class="form-label">Type *</label>
                                <select class="form-select" id="payroll-lookup-category-type" name="category_type">
                                    <option value="earning">Earning</option>
                                    <option value="deduction">Deduction</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="payroll-lookup-calculation-type" class="form-label">Calculation *</label>
                                <select class="form-select" id="payroll-lookup-calculation-type" name="calculation_type" onchange="togglePayrollCalculationFields()">
                                    <option value="fixed">Fixed Amount</option>
                                    <option value="percentage">Percentage of Basic Pay</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3" id="payroll-lookup-amount-group">
                            <label for="payroll-lookup-default-amount" class="form-label">Default Amount</label>
                            <input type="number" step="0.01" class="form-control" id="payroll-lookup-default-amount" name="default_amount">
                        </div>
                        <div class="mb-3 d-none" id="payroll-lookup-percentage-group">
                            <label for="payroll-lookup-default-percentage" class="form-label">Default Percentage</label>
                            <input type="number" step="0.01" class="form-control" id="payroll-lookup-default-percentage" name="default_percentage">
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="payroll-lookup-is-basic-pay" name="is_basic_pay">
                            <label class="form-check-label" for="payroll-lookup-is-basic-pay">
                                Use as Basic Pay (percentage base)
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="payroll-lookup-taxable" name="taxable">
                            <label class="form-check-label" for="payroll-lookup-taxable">Taxable (display only)</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <span id="payroll-lookup-submit-text">Create</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const PAYROLL_LOOKUP_LABELS = { payroll_category: 'Payroll Category', payroll_group: 'Payroll Group' };

function togglePayrollCalculationFields() {
    const calcType = document.getElementById('payroll-lookup-calculation-type').value;
    document.getElementById('payroll-lookup-amount-group').classList.toggle('d-none', calcType !== 'fixed');
    document.getElementById('payroll-lookup-percentage-group').classList.toggle('d-none', calcType !== 'percentage');
}

function showPayrollFieldGroups(key) {
    document.querySelectorAll('#payrollLookupModal .payroll-field-group').forEach(function (group) {
        group.style.display = group.getAttribute('data-for') === key ? '' : 'none';
    });
}

function openAddPayrollLookup(key) {
    const form = document.getElementById('payroll-lookup-form');
    form.reset();
    document.getElementById('payroll-lookup-key').value = key;
    document.getElementById('payroll-lookup-id').value = '';
    document.getElementById('payroll-lookup-modal-title').textContent = 'Add ' + PAYROLL_LOOKUP_LABELS[key];
    document.getElementById('payroll-lookup-submit-text').textContent = 'Create';
    document.getElementById('payroll-lookup-form-errors').classList.add('d-none');
    showPayrollFieldGroups(key);
    togglePayrollCalculationFields();
    new bootstrap.Modal(document.getElementById('payrollLookupModal')).show();
}

function openEditPayrollLookup(button) {
    const pane = button.closest('[data-lookup-key]');
    const key = pane.getAttribute('data-lookup-key');
    const form = document.getElementById('payroll-lookup-form');
    form.reset();
    document.getElementById('payroll-lookup-key').value = key;
    document.getElementById('payroll-lookup-id').value = button.dataset.lookupItem;
    document.getElementById('payroll-lookup-name').value = button.dataset.lookupName || '';
    document.getElementById('payroll-lookup-description').value = button.dataset.lookupDescription || '';
    document.getElementById('payroll-lookup-code').value = button.dataset.lookupCode || '';
    if (button.dataset.lookupCategoryType) document.getElementById('payroll-lookup-category-type').value = button.dataset.lookupCategoryType;
    if (button.dataset.lookupCalculationType) document.getElementById('payroll-lookup-calculation-type').value = button.dataset.lookupCalculationType;
    document.getElementById('payroll-lookup-default-amount').value = button.dataset.lookupDefaultAmount || '';
    document.getElementById('payroll-lookup-default-percentage').value = button.dataset.lookupDefaultPercentage || '';
    document.getElementById('payroll-lookup-is-basic-pay').checked = button.dataset.lookupIsBasicPay === '1';
    document.getElementById('payroll-lookup-taxable').checked = button.dataset.lookupTaxable === '1';

    document.getElementById('payroll-lookup-modal-title').textContent = 'Edit ' + PAYROLL_LOOKUP_LABELS[key];
    document.getElementById('payroll-lookup-submit-text').textContent = 'Update';
    document.getElementById('payroll-lookup-form-errors').classList.add('d-none');
    showPayrollFieldGroups(key);
    togglePayrollCalculationFields();
    new bootstrap.Modal(document.getElementById('payrollLookupModal')).show();
}

function submitPayrollLookupForm(event) {
    event.preventDefault();
    const key = document.getElementById('payroll-lookup-key').value;
    const id = document.getElementById('payroll-lookup-id').value;
    const form = document.getElementById('payroll-lookup-form');
    const url = id ? PAYROLL_LOOKUP_URLS.update(key, id) : PAYROLL_LOOKUP_URLS.create(key);

    fetch(url, { method: 'POST', headers: { 'X-CSRFToken': csrfToken() }, body: new FormData(form) })
        .then((response) => response.text().then((text) => ({ status: response.status, text })))
        .then(({ status, text }) => {
            if (status === 200) {
                document.getElementById(`payroll-lookup-content-${key}`).innerHTML = text;
                bootstrap.Modal.getInstance(document.getElementById('payrollLookupModal')).hide();
                showAlert('Saved successfully!', 'success');
            } else {
                let errors;
                try { errors = JSON.parse(text); } catch (e) { errors = { error: ['An error occurred'] }; }
                const errorDiv = document.getElementById('payroll-lookup-form-errors');
                let html = '';
                for (const [field, messages] of Object.entries(errors)) {
                    html += `<strong>${field}:</strong> ${[].concat(messages).join(', ')}<br>`;
                }
                errorDiv.innerHTML = html;
                errorDiv.classList.remove('d-none');
            }
        })
        .catch(() => showAlert('An error occurred', 'danger'));
}
</script>
