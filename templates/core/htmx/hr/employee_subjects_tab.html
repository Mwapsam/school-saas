<div id="employee-subjects-content">
    <div class="mb-2">
        <input type="text" class="form-control form-control-sm" placeholder="Search subjects or batch..."
               hx-get="{% url 'core:employee_subjects_tab' employee_id=employee_id %}"
               hx-trigger="input changed delay:400ms"
               hx-target="#employee-subjects-content"
               hx-swap="outerHTML"
               name="search">
    </div>
    <div style="max-height: 260px; overflow-y: auto;" class="border rounded p-2">
        {% for subject in subjects %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="subject_ids" value="{{ subject.id }}"
                       id="subj-{{ subject.id }}"
                       {% if subject.employee_id == employee_id %}checked{% endif %}>
                <label class="form-check-label" for="subj-{{ subject.id }}">
                    {{ subject.name }} <small class="text-muted">({{ subject.batch.name }})</small>
                    {% if subject.employee_id and subject.employee_id != employee_id %}
                        <small class="text-warning">&mdash; currently: {{ subject.employee.first_name }} {{ subject.employee.last_name }}</small>
                    {% endif %}
                </label>
            </div>
        {% empty %}
            <div class="text-muted small">No subjects found.</div>
        {% endfor %}
    </div>
    <button type="button" class="btn btn-primary btn-sm mt-2"
            hx-post="{% url 'core:employee_subjects_update' employee_id=employee_id %}"
            hx-target="#employee-subjects-content"
            hx-swap="outerHTML">
        Save Subject Assignments
    </button>
    <div class="form-text">Subjects checked here are assigned to this employee; unchecking one clears it (subjects assigned to other employees are shown but left untouched unless you check them).</div>
</div>
