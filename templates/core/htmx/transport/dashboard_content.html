{% if warnings %}
<div class="product-card mt-4">
  <h6 class="mb-3"><i class="fas fa-triangle-exclamation text-warning me-2"></i>Compliance warnings</h6>
  <ul class="list-group list-group-flush">
    {% for w in warnings %}
      <li class="list-group-item d-flex justify-content-between align-items-center px-0">
        <span>{{ w.vehicle }}</span>
        <span class="badge {% if w.state == 'expired' %}bg-danger{% else %}bg-warning{% endif %}">{{ w.detail }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
{% else %}
<div class="product-card mt-4 text-muted">
  <i class="fas fa-circle-check text-success me-2"></i>No compliance issues — all vehicle documents and driver licences are current.
</div>
{% endif %}
