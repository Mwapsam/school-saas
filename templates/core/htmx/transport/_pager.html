{% if is_paginated %}
<div class="product-table-pagination">
  <nav>
    <ul class="pagination pagination-sm justify-content-center mb-0">
      {% if page_obj.has_previous %}
        <li class="page-item"><a class="page-link" style="cursor:pointer"
          hx-get="{{ list_url }}?page={{ page_obj.previous_page_number }}"
          hx-target="#transport-{{ entity }}-content">Previous</a></li>
      {% endif %}
      <li class="page-item active"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
      {% if page_obj.has_next %}
        <li class="page-item"><a class="page-link" style="cursor:pointer"
          hx-get="{{ list_url }}?page={{ page_obj.next_page_number }}"
          hx-target="#transport-{{ entity }}-content">Next</a></li>
      {% endif %}
    </ul>
  </nav>
</div>
{% endif %}
